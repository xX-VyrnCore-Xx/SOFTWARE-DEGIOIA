# Crea automaticamente una Release GitHub (con l'installer Windows allegato)
# per ogni nuova versione di PresenzeFlow.
#
# Quando parte:
#   - push su main: se la versione nel .csproj non ha ancora una Release, la crea;
#   - push di un tag "vX.Y.Z": crea/aggiorna la Release di quel tag;
#   - manualmente da Actions (workflow_dispatch), per rigenerare l'ultima versione.
#
# La versione è quella scritta in PresenzeXmlConverter.csproj ed è obbligatorio
# che coincida con AppVersion di Installer.iss: se non coincidono il workflow
# si ferma e non pubblica nulla.
name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# Necessario per creare tag e Release.
permissions:
  contents: write

# Serializza le esecuzioni: un push su main e uno di tag non devono creare
# la stessa Release due volte in parallelo.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Leggi la versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Determina versione e se serve una nuova Release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' PresenzeXmlConverter/PresenzeXmlConverter.csproj | head -n1)
          installer_version=$(sed -n 's:.*#define AppVersion "\([^"]*\)".*:\1:p' Installer.iss | head -n1)

          echo "csproj=$version · Installer.iss=$installer_version"
          if [ -z "$version" ]; then
            echo "::error::Versione non trovata in PresenzeXmlConverter.csproj"
            exit 1
          fi
          if [ "$version" != "$installer_version" ]; then
            echo "::error::Versione disallineata: csproj=$version, Installer.iss=$installer_version. Aggiorna entrambi (vedi tools/New-Version.ps1)."
            exit 1
          fi

          # Se il push è su un tag, il tag è la fonte di verità.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione $version del progetto."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "La Release $tag esiste già: nessuna nuova Release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "La Release $tag non esiste: verrà creata."
          fi

  build-and-release:
    name: Compila, testa e pubblica
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # La firma digitale e' OBBLIGATORIA: senza certificato il workflow si ferma
      # (vedi lo step successivo). Un eseguibile non firmato fa attendere Windows
      # Defender 15-20 secondi al primo avvio e mostra "editore sconosciuto".
      - name: Prepara il certificato di firma
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Distinguere QUALE dei due secret manca: un nome scritto diversamente
          # equivale a nessun secret, e senza questo messaggio il motivo resta
          # invisibile (e' quello che faceva saltare la firma in silenzio).
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64))   { $missing += 'CODE_SIGNING_PFX_BASE64' }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { $missing += 'CODE_SIGNING_PFX_PASSWORD' }
          "missing=$($missing -join ', ')" >> $env:GITHUB_OUTPUT
          if ($missing.Count -gt 0) {
            Write-Host "Firma digitale non configurata: mancano i secret $($missing -join ', ')."
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # I due secret arrivano da un copia-incolla: spazi, a capo o righe
          # spezzate farebbero fallire l'apertura di un .pfx per il resto valido.
          $base64 = $env:PFX_BASE64 -replace '\s', ''
          $password = ($env:PFX_PASSWORD -replace '[\r\n]', '').Trim()
          if ($base64 -ne $env:PFX_BASE64 -or $password -ne $env:PFX_PASSWORD) {
            Write-Host 'I secret del certificato contenevano spazi o a capo: sono stati rimossi prima dell''uso.'
          }

          # .NET diretto invece di Import-PfxCertificate: nessuna dipendenza dal
          # modulo PKI e messaggi di errore comprensibili.
          try { $bytes = [Convert]::FromBase64String($base64) }
          catch { throw 'CODE_SIGNING_PFX_BASE64 non e'' Base64 valido: ricrealo con .\tools\New-CodeSigningCertificate.ps1' }
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x30 -or $bytes[1] -ne 0x82) {
            throw 'CODE_SIGNING_PFX_BASE64 non contiene un file .pfx: incolla il contenuto di codesign\PresenzeFlow-codesign.pfx.base64.txt'
          }

          # Diagnostica senza valori segreti: le impronte permettono di capire se i
          # due secret vengono dallo stesso certificato (una password presa da un
          # altro certificato e' l'errore piu' frequente).
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $pfxHash = [BitConverter]::ToString($sha256.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          $passwordHash = [BitConverter]::ToString(
            $sha256.ComputeHash([Text.Encoding]::UTF8.GetBytes($password))).Replace('-', '').ToLowerInvariant()
          $diagnostics = "pfx $($bytes.Length) byte (sha256 $pfxHash), password $($password.Length) caratteri (sha256 $passwordHash)"
          Write-Host "Diagnostica del certificato: $diagnostics"

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor `
                   [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet
          try {
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes, $password, $flags)
          } catch {
            throw ("Il .pfx non si apre: i due secret devono venire dallo stesso certificato. " +
              "La password e' quella salvata accanto al .pfx (codesign\PASSWORD.txt, oppure quella stampata da " +
              ".\tools\New-CodeSigningCertificate.ps1): non basta che sia lunga uguale, deve essere quella di QUEL .pfx. " +
              "Diagnostica: $diagnostics. Dettaglio di Windows: $($_.Exception.Message)")
          }
          if (-not $certificate.HasPrivateKey) { throw 'Il certificato non ha la chiave privata: senza di essa non si puo'' firmare.' }

          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
          try { $store.Open('ReadWrite'); $store.Add($certificate) } finally { $store.Close() }

          # Certificato pubblico: viene allegato alla Release perche' chi installa
          # PresenzeFlow possa renderlo attendibile (Trusted Root/Publisher).
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $publicCertificate = Join-Path $PWD (Join-Path 'dist' 'PresenzeFlow-codesign.cer')
          [IO.File]::WriteAllBytes($publicCertificate, $certificate.Export('Cert'))

          "SIGN_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "enabled=true" >> $env:GITHUB_OUTPUT
          Write-Host "Certificato pronto per la firma (scade il $($certificate.NotAfter.ToString('yyyy-MM-dd')))."

      - name: Firma obbligatoria
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        env:
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          $missing = '${{ steps.signing.outputs.missing }}'
          if ($env:ALLOW_UNSIGNED_RELEASE -eq 'true') {
            $relaxed = "Release NON firmata: firma non configurata (mancano: $missing) e ALLOW_UNSIGNED_RELEASE=true."
            Write-Warning $relaxed
            $relaxed | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          @(
            'Gli eseguibili uscirebbero NON firmati, quindi il workflow si ferma:'
            'una Release non firmata mostra "editore sconosciuto" e fa attendere'
            'Windows Defender 15-20 secondi al primo avvio.'
            ''
            "Mancano i secret: $missing"
            ''
            'Come sistemarlo (una volta sola, su Windows):'
            '  1. .\tools\New-CodeSigningCertificate.ps1'
            '  2. GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret:'
            '       CODE_SIGNING_PFX_BASE64   = contenuto di codesign\PresenzeFlow-codesign.pfx.base64.txt'
            '       CODE_SIGNING_PFX_PASSWORD = la password stampata dallo script'
            '     I nomi devono essere esattamente questi: anche un solo carattere diverso = secret assente.'
            ''
            'Per pubblicare comunque una Release non firmata, imposta la variabile'
            'ALLOW_UNSIGNED_RELEASE=true (Settings -> Secrets and variables -> Actions -> Variables).'
          ) | ForEach-Object { Write-Host $_ }

          throw "Firma digitale non configurata (mancano: $missing)."

      - name: Rendi disponibile signtool
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $pattern = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\signtool.exe'
          $tool = Get-ChildItem $pattern | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe non trovato sul runner: firma impossibile.' }
          $tool.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "signtool: $($tool.FullName)"

      - name: Test
        run: dotnet test .\PresenzeXmlConverter.Tests\PresenzeXmlConverter.Tests.csproj -c Release

      # Token di sola lettura per gli aggiornamenti: viene iniettato (offuscato) nel
      # codice PRIMA della compilazione, quindi ogni installer esce con gli
      # aggiornamenti gia' collegati e senza token nel repository.
      # Il secret si chiama PRESENZEFLOW_GITHUB_TOKEN (fine-grained, SOLO
      # "Contents: Read-only" su questo repository). Il token e' offuscato, non
      # cifrato: chi ha l'eseguibile puo' estrarlo, per questo non deve poter
      # scrivere ne' leggere altro.
      - name: Inietta il token di aggiornamento
        shell: pwsh
        env:
          PRESENZEFLOW_GITHUB_TOKEN: ${{ secrets.PRESENZEFLOW_GITHUB_TOKEN }}
          ALLOW_RELEASE_WITHOUT_UPDATE_TOKEN: ${{ vars.ALLOW_RELEASE_WITHOUT_UPDATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:PRESENZEFLOW_GITHUB_TOKEN)) {
            if ($env:ALLOW_RELEASE_WITHOUT_UPDATE_TOKEN -eq 'true') {
              $relaxed = 'Release SENZA token di aggiornamento incluso: secret PRESENZEFLOW_GITHUB_TOKEN assente e ALLOW_RELEASE_WITHOUT_UPDATE_TOKEN=true.'
              Write-Warning $relaxed
              $relaxed | Out-File $env:GITHUB_STEP_SUMMARY -Append
              exit 0
            }
            @(
              'Il secret PRESENZEFLOW_GITHUB_TOKEN non e'' configurato: senza di esso gli installer'
              'uscirebbero senza token e le app installate non riceverebbero aggiornamenti.'
              ''
              'Come sistemarlo (una volta sola):'
              '  1. GitHub -> Settings -> Developer settings -> Fine-grained tokens -> Generate new token'
              '     Repository access: solo questo repository. Permessi: Contents = Read-only (nient''altro).'
              '     Scadenza: la piu'' lunga consentita (alla scadenza gli aggiornamenti si fermano).'
              '  2. Settings -> Secrets and variables -> Actions -> New repository secret:'
              '       PRESENZEFLOW_GITHUB_TOKEN = il token appena creato'
              ''
              'Per pubblicare comunque una Release senza token, imposta la variabile'
              'ALLOW_RELEASE_WITHOUT_UPDATE_TOKEN=true (Settings -> Secrets and variables -> Actions -> Variables).'
            ) | ForEach-Object { Write-Host $_ }
            throw 'Token di aggiornamento non configurato (secret PRESENZEFLOW_GITHUB_TOKEN).'
          }

          # Un token gia' scaduto o senza accesso non va distribuito: si prova ORA
          # a leggere le Release come fara' l'app.
          $token = $env:PRESENZEFLOW_GITHUB_TOKEN.Trim()
          $headers = @{
            Authorization          = "Bearer $token"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'PresenzeFlow-Build'
          }
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:REPOSITORY)/releases?per_page=1" -Headers $headers | Out-Null
          } catch {
            throw "Il token PRESENZEFLOW_GITHUB_TOKEN non puo' leggere le Release di $($env:REPOSITORY): $($_.Exception.Message). Controlla scadenza e permesso Contents = Read-only."
          }

          .\tools\Inject-UpdateToken.ps1
          "### Token di aggiornamento`nIncluso (offuscato) nella build: le app installate ricevono gli aggiornamenti senza configurazione." | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Compila l'app (single file, win-x64)
        run: dotnet publish .\PresenzeXmlConverter\PresenzeXmlConverter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\dist\app

      - name: Verifica i file richiesti dall'installer
        shell: pwsh
        run: |
          foreach ($file in @('dist\app\PresenzeFlow.exe', 'dist\app\e_sqlite3.dll')) {
            if (-not (Test-Path $file)) {
              throw "File mancante dopo il publish: $file (l'app installata non partirebbe)."
            }
          }

      - name: Individua il compilatore Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe non trovato: Inno Setup 6 non è installato sul runner.' }

          # Versione minima richiesta: Inno Setup 6.3, non 6.1. Lo script usa
          # CreateDownloadPage (dalla 6.1) ma anche due funzionalità introdotte
          # nella 6.3: la proprietà ShowBaseNameInsteadOfUrl della pagina di
          # download e l'identificatore di architettura 'x64compatible' di
          # ArchitecturesAllowed. Su una 6.1/6.2 lo script non compilerebbe:
          # meglio un errore chiaro qui che un errore di sintassi a metà.
          # Attenzione: ISCC.exe NON dichiara la versione (le sue risorse dicono
          # 0.0.0.0), quindi la versione vera va cercata nel registro delle
          # installazioni; se non è determinabile si prosegue, perché a mancare
          # quelle funzionalità lo segnala ISCC stesso con un errore preciso.
          $version = $null
          $uninstallKeys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          )
          foreach ($key in $uninstallKeys) {
            if (-not (Test-Path $key)) { continue }
            $display = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).DisplayVersion
            if (-not [string]::IsNullOrWhiteSpace($display)) { $version = $display.Trim(); break }
          }
          if (-not $version) {
            # Fallback: qualunque voce di disinstallazione di Inno Setup.
            $uninstallRoots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            foreach ($root in $uninstallRoots) {
              if (-not (Test-Path $root)) { continue }
              $entry = Get-ChildItem $root -ErrorAction SilentlyContinue |
                ForEach-Object { Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue } |
                Where-Object { $_.DisplayName -like 'Inno Setup*' -and $_.DisplayVersion } |
                Select-Object -First 1
              if ($entry) { $version = $entry.DisplayVersion.Trim(); break }
            }
          }
          if (-not $version) {
            # Ultima spiaggia: risorse del file, scartando il valore fittizio 0.0.0.0.
            $info = (Get-Item $iscc).VersionInfo
            foreach ($candidate in @($info.ProductVersion, $info.FileVersion)) {
              if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate.Trim() -notmatch '^0(\.0+)*$') {
                $version = $candidate.Trim()
                break
              }
            }
          }

          if (-not $version) {
            Write-Warning 'Versione di Inno Setup non determinabile: proseguo (se le funzionalità richieste non sono disponibili, ISCC lo segnala durante la compilazione).'
          } else {
            $parts = $version.Split('.')
            $major = 0
            $minor = 0
            [void][int]::TryParse($parts[0], [ref]$major)
            if ($parts.Count -ge 2) { [void][int]::TryParse($parts[1], [ref]$minor) }
            if ($major -lt 6 -or ($major -eq 6 -and $minor -lt 3)) {
              throw "Inno Setup $version trovato: l'installer richiede Inno Setup 6.3 o successivo (ShowBaseNameInsteadOfUrl e ArchitecturesAllowed=x64compatible)."
            }
            Write-Host "Inno Setup $version"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Uso $iscc"

      - name: Firma l'eseguibile
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $exe = 'dist\app\PresenzeFlow.exe'
          if (-not (Test-Path $exe)) { throw "Eseguibile mancante dopo il publish: $exe" }
          signtool.exe sign /sha1 $env:SIGN_CERT_THUMBPRINT /s My /fd sha256 /td sha256 /tr http://timestamp.digicert.com "$exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool è terminato con codice ${LASTEXITCODE}: firma dell'eseguibile non riuscita." }
          # La firma viene verificata, non data per buona: signtool puo' uscire con
          # codice 0 senza aver firmato (certificato non trovato nella memoria).
          .\tools\Test-CodeSignature.ps1 -Path $exe -Thumbprint $env:SIGN_CERT_THUMBPRINT
          Write-Host 'Eseguibile firmato e verificato.'

      - name: Compila l'installer
        shell: pwsh
        run: |
          $arguments = @('Installer.iss')
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            # Inno usa questo comando per firmare l'installer e il disinstallatore.
            $signCommand = "signtool.exe sign /sha1 $env:SIGN_CERT_THUMBPRINT /s My /fd sha256 /td sha256 /tr http://timestamp.digicert.com `$f"
            $arguments = @('-dEnableSigning=1', "-sci=$signCommand") + $arguments
            # L'installer propone di rendere attendibile il certificato (solo utente
            # corrente) e lo toglie alla disinstallazione: servono il file .cer e l'impronta.
            if (Test-Path 'dist\PresenzeFlow-codesign.cer') {
              $arguments = @('-dTrustCertificate=1', "-dCertThumbprint=$env:SIGN_CERT_THUMBPRINT") + $arguments
            }
            Write-Host 'L''installer verrà firmato.'
          } else {
            Write-Host 'L''installer verrà prodotto senza firma.'
          }
          & '${{ steps.iscc.outputs.path }}' @arguments
          if ($LASTEXITCODE -ne 0) { throw "ISCC è terminato con codice ${LASTEXITCODE}: l'installer non è stato compilato." }
          $installer = "dist\PresenzeFlow-Setup-${{ needs.prepare.outputs.version }}.exe"
          if (-not (Test-Path $installer)) { throw "Installer non generato: $installer" }
          Get-Item $installer | Select-Object Name, Length
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            # Inno Setup firma installer e disinstallatore con lo stesso SignTool
            # passato con -sci=...: qui si controlla che la firma ci sia davvero.
            .\tools\Test-CodeSignature.ps1 -Path $installer -Thumbprint $env:SIGN_CERT_THUMBPRINT
          }

      - name: Calcola il checksum SHA-256 dell'installer
        shell: pwsh
        run: |
          $installer = "dist\PresenzeFlow-Setup-${{ needs.prepare.outputs.version }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $name = Split-Path $installer -Leaf
          "$hash  $name" | Set-Content -Path "$installer.sha256" -Encoding ascii -NoNewline
          Get-Content "$installer.sha256"

      - name: Prepara i file della Release
        id: artifacts
        shell: pwsh
        run: |
          $installer = "dist\PresenzeFlow-Setup-${{ needs.prepare.outputs.version }}.exe"
          # L'app scarica l'installer e ne verifica il checksum SHA-256.
          $files = @($installer, "$installer.sha256")
          # Quando la Release e' firmata si allega anche il certificato PUBBLICO, cosi'
          # i PC possono renderlo attendibile (Trusted Root/Trusted Publisher).
          if (Test-Path 'dist\PresenzeFlow-codesign.cer') { $files += 'dist\PresenzeFlow-codesign.cer' }
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "File da pubblicare mancante: $file" }
          }

          $relative = $files | ForEach-Object { $_ -replace '\\', '/' }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $relative -join "`n" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          $relative | ForEach-Object { Write-Host "Da pubblicare: $_" }

          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            "### Release firmata`nEseguibile e installer firmati e verificati (impronta $env:SIGN_CERT_THUMBPRINT)." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          else {
            "### Release NON firmata`nFirma digitale non configurata e ALLOW_UNSIGNED_RELEASE=true." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Crea la Release GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PresenzeFlow ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.files }}
