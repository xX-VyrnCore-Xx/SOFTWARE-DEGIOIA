# Controlli automatici su ogni pull request e su ogni ramo diverso da main.
#
# Perche' esiste: i test giravano SOLO nel workflow di rilascio, cioe' DOPO il
# merge su main. Un errore (test rosso, installer che non compila) veniva scoperto
# a rilascio gia' partito e bloccava la Release. Qui gli stessi controlli girano
# PRIMA del merge, cosi' main resta sempre rilasciabile.
#
# Consiglio (impostazione di GitHub, non automatizzabile da qui): Settings ->
# Branches -> regola per "main" -> "Require status checks to pass before merging"
# e selezionare "Test" e "Installer". Con la regola attiva un merge con test rossi
# non e' possibile.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Un nuovo push sullo stesso ramo annulla il controllo precedente, ormai superato.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Stesso controllo del rilascio: la versione del progetto e quella
      # dell'installer devono coincidere, altrimenti la Release non parte.
      - name: Coerenza delle versioni
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' PresenzeXmlConverter/PresenzeXmlConverter.csproj | head -n1)
          installer=$(sed -n 's:.*#define AppVersion "\([^"]*\)".*:\1:p' Installer.iss | head -n1)
          echo "csproj=$version · Installer.iss=$installer"
          if [ -z "$version" ] || [ "$version" != "$installer" ]; then
            echo "::error::La versione del .csproj ($version) e quella di Installer.iss ($installer) devono coincidere."
            exit 1
          fi

      - name: Test
        env:
          # Le schermate si salvano solo nelle esecuzioni manuali (vedi sotto).
          PRESENZEFLOW_SCREENSHOT_DIR: ${{ github.event_name == 'workflow_dispatch' && format('{0}\screenshots', github.workspace) || '' }}
        run: dotnet test .\PresenzeXmlConverter.Tests\PresenzeXmlConverter.Tests.csproj -c Release

      # Solo a richiesta: le stesse schermate a 125% di scala (processo a parte,
      # perche' la scala si imposta una volta sola per processo). Non ferma la CI.
      - name: Schermate a 125% di scala
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PRESENZEFLOW_SCREENSHOT_DIR: ${{ format('{0}\screenshots', github.workspace) }}
          PRESENZEFLOW_DPI_SHOTS: '125'
        run: dotnet test .\PresenzeXmlConverter.Tests\PresenzeXmlConverter.Tests.csproj -c Release --filter "FullyQualifiedName~DpiScreenshotTests"

      # Solo a richiesta (Run workflow): le stesse schermate vengono pubblicate sul
      # ramo "schermate", cosi' si possono aprire direttamente da git senza
      # scaricare lo zip degli artifact.
      - name: Pubblica le schermate sul ramo "schermate"
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d screenshots ] || [ -z "$(ls -A screenshots)" ]; then
            echo "Nessuna schermata da pubblicare."
            exit 0
          fi
          rm -rf /tmp/shots && mkdir /tmp/shots && cp screenshots/* /tmp/shots/
          cd /tmp/shots
          git init -q -b schermate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Schermate dei test grafici (${GITHUB_SHA})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" schermate

      # Prova di punta a punta dell'iniezione del token: lo script riscrive il
      # sorgente con un token finto e un test controlla che l'app lo ritrovi.
      # Il token e' inventato: nessun secret in gioco (vale anche per le PR da fork).
      - name: Iniezione del token (prova con un token finto)
        shell: pwsh
        env:
          PRESENZEFLOW_GITHUB_TOKEN: ghp_ProvaIniezioneTokenFinto0123456789abcdef
          PRESENZEFLOW_TEST_INJECTION: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\Inject-UpdateToken.ps1
          dotnet test .\PresenzeXmlConverter.Tests\PresenzeXmlConverter.Tests.csproj -c Release --filter "FullyQualifiedName~InjectedToken"
          if ($LASTEXITCODE -ne 0) { throw 'Il token iniettato non viene ritrovato dall''app.' }

  installer:
    name: Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Compila l'app (single file, win-x64)
        run: dotnet publish .\PresenzeXmlConverter\PresenzeXmlConverter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\dist\app

      - name: Verifica i file richiesti dall'installer
        shell: pwsh
        run: |
          foreach ($file in @('dist\app\PresenzeFlow.exe', 'dist\app\e_sqlite3.dll', 'dist\app\wpfgfx_cor3.dll', 'dist\app\PresentationNative_cor3.dll')) {
            if (-not (Test-Path $file)) {
              throw "File mancante dopo il publish: $file (l'app installata non partirebbe)."
            }
          }

      # La nuova interfaccia (WPF) deve partire dall'eseguibile pubblicato: se non parte il programma ripiega
      # sulla classica, quindi qui si verifica che resti viva e che non abbia scritto il ripiego nel registro errori.
      - name: Avvio di prova della nuova interfaccia
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'DeGioia\PresenzeXmlConverter\error.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $process = Start-Process -FilePath '.\dist\app\PresenzeFlow.exe' -ArgumentList '--wpf' -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $process.HasExited
          if ($alive) { Stop-Process -Id $process.Id -Force }
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if (-not $alive) { throw "L'app pubblicata e' terminata entro 12 secondi." }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Nuova interfaccia non avviata' -Quiet)) {
            throw "La nuova interfaccia non e' partita (vedi sopra): il programma ripiegherebbe sulla classica."
          }

      # L'installer ha il suo linguaggio (Pascal Script) e i suoi errori di
      # sintassi emergono solo compilandolo: meglio saperlo prima del merge.
      - name: Compila l'installer (senza firma)
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe non trovato: Inno Setup 6 non e'' installato sul runner.' }

          # Il ramo "certificato attendibile" dell'installer esiste solo se si passano i
          # simboli del rilascio: per non scoprirne gli errori a rilascio gia' partito si
          # compila qui con un certificato usa e getta (mai usato per firmare).
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PresenzeFlow CI (prova)' -CertStoreLocation 'Cert:\CurrentUser\My'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Export-Certificate -Cert $certificate -FilePath 'dist\PresenzeFlow-codesign.cer' | Out-Null
          & $iscc '-dTrustCertificate=1' "-dCertThumbprint=$($certificate.Thumbprint)" Installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC e' terminato con codice ${LASTEXITCODE}: l'installer non compila." }
          $version = (Select-String -Path Installer.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          $installer = "dist\PresenzeFlow-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer non generato: $installer" }
          Get-Item $installer | Select-Object Name, Length
